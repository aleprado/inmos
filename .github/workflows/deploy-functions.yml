name: "Deploy Backend (Cloud Functions)"

on:
  push:
    branches:
      - main
    paths:
      - 'infra/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy_functions:
    name: "Deploy Firebase Functions"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/functions

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "WA_ACCESS_TOKEN=${{ secrets.WA_ACCESS_TOKEN }}" >> .env
          echo "WA_PHONE_NUMBER_ID=${{ secrets.WA_PHONE_NUMBER_ID }}" >> .env
          echo "WA_VERIFY_TOKEN=${{ secrets.WA_VERIFY_TOKEN }}" >> .env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Functions
        run: firebase deploy --only functions --non-interactive
