name: "Deploy Backend (Cloud Functions)"

on:
  push:
    branches:
      - main
    paths:
      - 'infra/functions/**'
      - 'infra/firestore.rules'
      - 'infra/firestore.indexes.json'
      - 'infra/storage.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy_functions:
    name: "Deploy Firebase Functions + Rules"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Function Dependencies
        working-directory: ./infra/functions
        run: npm install

      - name: Create Functions .env file
        working-directory: ./infra/functions
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "WA_ACCESS_TOKEN=${{ secrets.WA_ACCESS_TOKEN }}" >> .env
          echo "WA_PHONE_NUMBER_ID=${{ secrets.WA_PHONE_NUMBER_ID }}" >> .env
          echo "APP_DOMAIN=${{ secrets.VITE_APP_DOMAIN }}" >> .env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Functions + Firestore + Storage Rules
        run: firebase deploy --only functions,firestore,storage --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive --force
